# Enhanced Wall Following Navigation Parameters
# Optimized for perfect wall detection and following behavior

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Enhanced behavior tree for wall following
    default_nav_to_pose_bt_xml: $(find-pkg-share turtle_bot_navigation)/behavior_trees/wall_following_bt.xml
    default_nav_through_poses_bt_xml: $(find-pkg-share turtle_bot_navigation)/behavior_trees/wall_following_bt.xml

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0  # Higher frequency for precise wall following
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Enhanced progress checker for wall following
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3  # Reduced for precise wall following
      movement_time_allowance: 15.0

    # Enhanced goal checker for wall following
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15  # Tighter tolerance for wall following
      yaw_goal_tolerance: 0.2
      
    # Enhanced DWB controller for wall following
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.4  # Moderate speed for wall following
      max_vel_y: 0.0
      max_vel_theta: 1.2
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      # Enhanced acceleration limits for smooth wall following
      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 20  # More samples for precise control
      vy_samples: 1
      vth_samples: 20
      sim_time: 2.0  # Longer simulation time for wall following
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      # Enhanced critics for wall following
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "WallDistance"]
      BaseObstacle.scale: 0.02  # Lower obstacle cost for wall following
      PathAlign.scale: 32.0    # Higher path alignment
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0    # Higher goal alignment
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0     # Higher path distance cost
      GoalDist.scale: 24.0     # Higher goal distance cost
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      # Custom wall distance critic
      WallDistance.scale: 10.0
      WallDistance.target_distance: 0.4  # 40cm target distance from walls

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0  # Higher update frequency
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 4  # Larger local costmap for wall detection
      height: 4
      resolution: 0.025  # Higher resolution for precise wall detection
      robot_radius: 0.25  # Enhanced robot radius
      plugins: ["voxel_layer", "enhanced_obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0  # Higher cost scaling for wall avoidance
        inflation_radius: 0.8  # Larger inflation for wall detection
      enhanced_obstacle_layer:
        plugin: "turtle_bot_navigation::EnhancedObstacleLayer"
        enabled: True
        observation_sources: scan
        wall_detection_range: 3.0  # Extended wall detection range
        wall_thickness: 0.1
        wall_confidence_threshold: 0.8
        enable_wall_enhancement: True
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5  # Extended raytrace range
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0  # Extended obstacle range
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "enhanced_obstacle_layer", "inflation_layer"]
      enhanced_obstacle_layer:
        plugin: "turtle_bot_navigation::EnhancedObstacleLayer"
        enabled: True
        observation_sources: scan
        wall_detection_range: 3.0
        wall_thickness: 0.1
        wall_confidence_threshold: 0.8
        enable_wall_enhancement: True
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.8
      always_send_full_costmap: True

# Enhanced map server for wall following
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

# Enhanced map saver for wall following
map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0  # Higher planning frequency
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.2  # Tighter tolerance for wall following
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 1.2]  # Enhanced for wall following
    min_velocity: [-0.4, 0.0, -1.2]
    max_accel: [1.5, 0.0, 2.0]  # Smooth acceleration for wall following
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
